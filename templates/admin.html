<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления PVXEN</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .form-box { background: #2a2a2a; padding: 20px; max-width: 100%; border-radius: 8px; margin-bottom: 25px; }
        input { width: 90%; padding: 12px; margin: 10px 0; background: #333; border: 1px solid #555; color: #fff; border-radius: 4px; }
        button { padding: 12px 25px; background: #ff4500; border: none; color: white; cursor: pointer; border-radius: 5px; width: 100%; font-weight: bold; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #444; text-align: left; }
        th { background: #333; }
    </style>
</head>
<body>
    <h1>Панель управления PVXEN</h1>
    
    <div class="form-box">
        <h3>Добавить участника</h3>
        <form method="POST">
            <input type="text" name="nickname" placeholder="Никнейм игрока" required><br>
            <input type="text" name="standoff_id" placeholder="ID в Standoff 2" required><br>
            <button type="submit">Добавить в базу</button>
        </form>
    </div>

    <h3>Список игроков:</h3>
    <div class="table-wrapper">
        <table>
            <tr>
                <th>ID 1</th>
                <th>Никнейм</th>
                <th>Standoff ID</th>
                <th>Сгенерированный ID 2</th>
            </tr>
            {% for player in players %}
            <tr>
                <td>{{ player[0] }}</td>
                <td>{{ player[1] }}</td>
                <td>{{ player[2] }}</td>
                <td>{{ player[3] }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
    <br>
    <a href="/" style="color: #ff4500;">Перейти на главный сайт</a>
</body>
</html>
